<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sigma_A^vee</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    html, body, #plot { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }
  </style>
</head>
<body>
  <div id="plot" aria-label="Interactive 3D surface"></div>
  <script>
    const surface = {"x":[-2.0,2.0,4.0,1.0,-3.0,-4.0,0.0,1.0,1.0,2.0],"y":[3.0,1.0,-1.0,-3.0,-2.0,-1.0,0.0,1.0,-1.0,-1.0],"z":[0.12655481679405123,0.08666832370181651,0.06471757907164605,0.0876062055966362,0.12548520060481783,0.13646057291990304,0.10259657407982767,0.09563619793284864,0.09162120176474242,0.0826533275337103],"i":[8,0,0,8,1,0,7,4,6,9,9,9],"j":[0,4,5,9,0,8,9,3,3,2,8,3],"k":[6,6,4,7,7,7,1,6,8,1,3,2],"edges":[{"x":[-4.0,-3.0,1.0,4.0,2.0,-2.0,-4.0],"y":[-1.0,-2.0,-3.0,-1.0,1.0,3.0,-1.0],"z":[0.13646057291990304,0.12548520060481783,0.0876062055966362,0.06471757907164605,0.08666832370181651,0.12655481679405123,0.13646057291990304],"cell":0}]};
    const surfaceTrace = {
      type: "mesh3d",
      x: surface.x, y: surface.y, z: surface.z,
      i: surface.i, j: surface.j, k: surface.k,
      color: "#9ecae1",
      opacity: 0.95,

      flatshading: true,
      hovertemplate: "x=%{x}<br>y=%{y}<br>value=%{z}<extra></extra>"
    };
    const traces = [surfaceTrace];

    const edgeColors = ["#111827", "#b91c1c", "#047857", "#7c3aed",
                        "#c2410c", "#0e7490", "#4338ca", "#4d7c0f"];
    surface.edges.forEach((edge, index) => traces.push({
      type: "scatter3d",
      mode: "lines",
      x: edge.x, y: edge.y, z: edge.z,
      line: {color: "#991b1b", width: 6},
      hoverinfo: "skip",
      showlegend: false
    }));

    const layout = {
      title: "sigma_A^vee",
      scene: {
        xaxis: {title: "x"},
        yaxis: {title: "y"},
        zaxis: {title: "value"},
        aspectmode: "manual",
        aspectratio: {"x":8.0,"y":6.0,"z":0.071742993848257}
      },
      margin: {l: 0, r: 0, b: 0, t: 48}
    };
    Plotly.newPlot("plot", traces, layout, {responsive: true, displaylogo: false});
  </script>
</body>
</html>
