  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    const x = d3.scaleLog()
      .domain(d3.extent(data, d =&gt; d[0]))
      .nice()

      .constant(1e-4)

    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;grid grid-x&#x27;)
      .attr(&#x27;transform&#x27;, `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).ticks(compact ? 4 : 7).tickSize(-innerHeight).tickFormat(&#x27;&#x27;));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;grid grid-y&#x27;)
      .call(d3.axisLeft(y).ticks(compact ? 5 : 7).tickSize(-innerWidth).tickFormat(&#x27;&#x27;));

      .attr(&#x27;data-chart-frame&#x27;, &#x27;true&#x27;)
      .attr(&#x27;x&#x27;, 0).attr(&#x27;y&#x27;, 0)
      .attr(&#x27;width&#x27;, innerWidth).attr(&#x27;height&#x27;, innerHeight);

    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;axis axis-x&#x27;)
      .attr(&#x27;transform&#x27;, `translate(0,${innerHeight})`)
      .call(d3.axisBottom(x).ticks(compact ? 4 : 7).tickFormat(formatAxis));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;axis axis-y&#x27;)
      .call(d3.axisLeft(y).ticks(compact ? 5 : 7).tickFormat(formatAxis));

      .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Area V_P (log scale)&#x27;);
    chart.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;y&#x27;)
      .attr(&#x27;transform&#x27;, &#x27;rotate(-90)&#x27;)
      .attr(&#x27;x&#x27;, -innerHeight / 2).attr(&#x27;y&#x27;, -margin.left + 20)
      .attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Q_P(g)^2 (symlog; zero included)&#x27;);

    plotted = data.map(d =&gt; ({ d, x: x(d[0]), y: y(d[1]) }));
    chart.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;points&#x27;)
      .selectAll(&#x27;circle&#x27;).data(plotted).join(&#x27;circle&#x27;)
      .attr(&#x27;class&#x27;, p =&gt; `point${p.d[1] === 0 ? &#x27; zero&#x27; : &#x27;&#x27;}`)
      .attr(&#x27;cx&#x27;, p =&gt; p.x).attr(&#x27;cy&#x27;, p =&gt; p.y).attr(&#x27;r&#x27;, radius);
    const hoverPoint = chart.append(&#x27;circle&#x27;).attr(&#x27;class&#x27;, &#x27;hover-point&#x27;).attr(&#x27;r&#x27;, 5).attr(&#x27;visibility&#x27;, &#x27;hidden&#x27;);
    overlay = chart.append(&#x27;rect&#x27;)
      .attr(&#x27;data-chart-hit&#x27;, &#x27;true&#x27;)

      .attr(&#x27;x&#x27;, 0).attr(&#x27;y&#x27;, 0).attr(&#x27;width&#x27;, innerWidth).attr(&#x27;height&#x27;, innerHeight)
      .attr(&#x27;fill&#x27;, &#x27;transparent&#x27;);
    quadtree = d3.quadtree().x(p =&gt; p.x).y(p =&gt; p.y).addAll(plotted);

    const nearest = event =&gt; {
      const [px, py] = d3.pointer(event, overlay.node());
      return quadtree.find(px, py, compact ? 28 : 36);

    overlay.on(&#x27;pointermove&#x27;, event =&gt; {
      const item = nearest(event);
      if (!item) { hoverPoint.attr(&#x27;visibility&#x27;, &#x27;hidden&#x27;); hideTooltip(); return; }

      showTooltip(event, item);
    }).on(&#x27;pointerleave&#x27;, () =&gt; { hoverPoint.attr(&#x27;visibility&#x27;, &#x27;hidden&#x27;); hideTooltip(); })
      .on(&#x27;pointerdown&#x27;, event =&gt; {
        const item = nearest(event);
        if (!item) return;
        hoverPoint.attr(&#x27;cx&#x27;, item.x).attr(&#x27;cy&#x27;, item.y).attr(&#x27;visibility&#x27;, &#x27;visible&#x27;);
        showTooltip(event, item);
      });
  }

  draw();
  const observer = new ResizeObserver(() =&gt; {
    if (plotWrap.clientWidth !== currentSize) draw();
  });
  observer.observe(plotWrap);
})();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;

      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    pendingTrigger = trigger;
    const delay =

    openTimeout = window.setTimeout(() =&gt; {
